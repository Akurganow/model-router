name: release

# Releases the plugin with cocogitto (https://docs.cocogitto.io) straight on
# main when a feat, fix or breaking commit follows the last tag. cog.toml has
# the pre-bump hook that writes the version into .claude-plugin/plugin.json.
#
# Loop guard: a push made with GITHUB_TOKEN starts no new workflow run
# (documentation: https://github.com/github/docs/blob/75ea7dd097a5564f27364a5b70eaa1979106eabd/data/reusables/actions/actions-do-not-trigger-workflows.md),
# so the version commit and its tag cannot rerun this workflow.
on:
  push:
    branches: [main]

# One release at a time; the next run starts from the main this one pushed.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Pushing the commit and the tag and creating the release need contents: write.
    permissions:
      contents: write
    steps:
      # Pinned to a commit sha; the comment records the release. ref: main
      # takes the newest main; fetch-depth: 0 brings the history and the tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      # The pre-bump hook runs scripts/set-version.ts, a TypeScript file that
      # Node runs directly.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # cocogitto 7.0.0's release archive for this runner, pinned by sha256
      # and checked before use. The digest matches GitHub's record of the upload.
      - name: Install cocogitto
        env:
          COG_URL: https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz
          COG_SHA256: e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o cocogitto.tar.gz "$COG_URL"
          printf '%s  %s\n' "$COG_SHA256" cocogitto.tar.gz | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf cocogitto.tar.gz --strip-components=1 -C "$HOME/.local/bin" x86_64-unknown-linux-musl/cog
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cog" --version | grep -F '7.0.0'

      # Without a tag, cocogitto reads the history from the first commit
      # (source: https://github.com/cocogitto/cocogitto/blob/055a9fa8db8ac8ce50074d50162b48b92e9d0c47/crates/cocogitto/src/conventional/bump.rs#L190-L194).
      # That would release a version no seed recorded, so a missing seed stops the run.
      - name: Refuse to release without a seed tag
        run: |
          if [ -z "$(git tag --merged HEAD -l 'v*')" ]; then
            echo "::error::No v* tag is reachable from main; seed it before releasing."
            exit 1
          fi

      # cog bump --auto exits 0 and changes nothing when no commit is
      # releasable, so an unmoved HEAD is the signal to stop.
      - name: Bump the version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          cog bump --auto
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "No releasable commit."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(git tag -l 'v*' --points-at HEAD)
          echo "New tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      # Atomic: the commit and the tag land together or not at all.
      - name: Push the version commit and its tag
        if: steps.bump.outputs.released == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$TAG"

      # The notes are cocogitto's changelog section for the tag.
      # It reads the tags on main's head and skips released ones, so re-running
      # a run whose release step failed creates only the missing release.
      - name: Create one GitHub release per tag on main's head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag -l 'v*' --points-at HEAD); do
            gh release view "$tag" >/dev/null 2>&1 && continue
            notes="$RUNNER_TEMP/$tag.md"
            cog changelog --at "$tag" > "$notes"
            [ -s "$notes" ] || { echo "::error::no changelog section for $tag"; exit 1; }
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"
          done
