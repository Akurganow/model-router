name: evals

# Runs a real headless client against the plugin installed from this
# repository, once per shipped client, and asserts that the first subagent
# spawn was routed. The cases are in evals/cases.json.
#
# It runs on manual dispatch only, because every run costs model usage. It
# never runs on a pull request or after a release.
#
# Secrets are named, never inherited. A client job sees only its own model
# key and the TypeSafe key, and only in the step that runs the cases.
#   ANTHROPIC_API_KEY   key for Claude Code
#   OPENROUTER_API_KEY  key for OpenRouter, which serves the omp case's model
#   TYPESAFE_API_KEY    key for the TypeSafe scoring endpoint
on:
  workflow_dispatch:
    inputs:
      clients:
        description: Clients separated by spaces, such as "claude omp", or empty for all
        type: string
        required: false
        default: ""
      ref:
        description: Tag or branch to install the plugin from, or empty for the ref of this run. It must hold scripts/build.ts and .github/actions/setup-node
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  claude:
    if: ${{ inputs.clients == '' || contains(format(' {0} ', inputs.clients), ' claude ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keeps Claude Code at the pinned version for the whole job.
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # Actions are pinned to a commit sha, as in ci.yml. The checkout does not
      # keep the job token, because a session can read .git/config and its
      # output is uploaded.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-claude-code

      # The plugin runs the bundle, so the cases use a fresh build of src/ at this ref.
      - name: Build the plugin bundles
        run: |
          npm ci
          node scripts/build.ts

      - name: Install the plugin from the checkout
        run: |
          claude plugin marketplace add "$PWD"
          claude plugin install model-router@model-router

      - name: Run the cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/evals.ts run --client claude --out "$RUNNER_TEMP/results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evals-claude
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          # A re-run uploads under the same name, and the action fails when
          # the first attempt's artifact exists.
          overwrite: true

  omp:
    if: ${{ inputs.clients == '' || contains(format(' {0} ', inputs.clients), ' omp ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The same checkout as the claude job, by YAML alias.
      - *checkout

      - uses: ./.github/actions/setup-node

      # omp runs on Bun. The package declares bun >=1.3.14 in its engines.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # The omp package is signed and carries a provenance attestation on npm.
      # No release asset with a checksum is published for it, so
      # evals/omp/bun.lock pins omp and every package it pulls in by digest.
      # Bun refuses a lockfile that no longer matches the manifest, and a
      # tarball whose digest differs. No package runs code at install time.
      # Renovate proposes new omp versions.
      - name: Install omp
        working-directory: evals/omp
        run: |
          bun install --frozen-lockfile --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          version=$(node -p 'require("./package.json").dependencies["@oh-my-pi/pi-coding-agent"]')
          node_modules/.bin/omp --version | grep -F "$version"

      # The plugin runs the bundle, so the cases use a fresh build of src/ at this ref.
      - name: Build the plugin bundles
        run: |
          npm ci
          node scripts/build.ts

      - name: Install the plugin from the checkout
        run: |
          omp plugin marketplace add "$PWD"
          omp plugin install model-router@model-router

      # The omp case names OPENROUTER_API_KEY in "keyEnv" in evals/cases.json.
      - name: Run the cases
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/evals.ts run --client omp --out "$RUNNER_TEMP/results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evals-omp
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          overwrite: true
