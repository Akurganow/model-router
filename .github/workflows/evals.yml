name: evals

# Runs a real headless client against the plugin installed from this
# repository, once per shipped client, and asserts that the first subagent
# spawn was routed. The cases are in evals/cases.json.
#
# It runs on manual dispatch and from release.yml after a release is
# published. It never runs on a pull request. A failure here leaves the
# release as it is.
#
# Secrets are named, never inherited. A client job sees only its own model
# key and the TypeSafe key, and only in the step that runs the cases.
#   ANTHROPIC_API_KEY     key for Claude Code
#   OMP_PROVIDER_API_KEY  key for the model provider that omp uses. The job
#                         exports it as the variable that the omp case names
#                         in "keyEnv" in evals/cases.json.
#   TYPESAFE_API_KEY      key for the TypeSafe scoring endpoint
on:
  workflow_dispatch:
    inputs:
      clients:
        description: Clients separated by spaces, such as "claude omp", or empty for all
        type: string
        required: false
        default: ""
      ref:
        description: Tag or branch to install the plugin from, or empty for the ref of this run
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      clients:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      OMP_PROVIDER_API_KEY:
        required: true
      TYPESAFE_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  claude:
    if: ${{ inputs.clients == '' || contains(format(' {0} ', inputs.clients), ' claude ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keeps Claude Code at the pinned version for the whole job.
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # Actions are pinned to a commit sha, as in ci.yml. The checkout does not
      # keep the job token, because a session can read .git/config and its
      # output is uploaded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The stream-json event that carries the decision line is verified in
      # this version, which is newer than the pin in ci.yml. The install runs
      # outside the checkout, so the repository's .npmrc does not apply to a
      # tool that is no dependency. The registry digest must equal the pinned
      # one before npm installs, and npm checks the tarball against it.
      - name: Install Claude Code
        working-directory: ${{ runner.temp }}
        env:
          VERSION: 2.1.296
          INTEGRITY: sha512-OX/k/rpcthMqnFKOWcpNcbiLsMKtAjLOpQNJHlYiDCFUznWCIwdRTyl/p9SdHVrsrzZuPMCNqZjnpakIni6upw==
        run: |
          actual=$(npm view "@anthropic-ai/claude-code@$VERSION" dist.integrity)
          [ "$actual" = "$INTEGRITY" ] || { echo "::error::registry digest of claude-code $VERSION changed"; exit 1; }
          npm install -g "@anthropic-ai/claude-code@$VERSION"
          claude --version | grep -F "$VERSION"

      - name: Install the plugin from the checkout
        run: |
          claude plugin marketplace add "$PWD"
          claude plugin install model-router@model-router

      - name: Run the cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/evals.ts run --client claude --out "$RUNNER_TEMP/results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evals-claude
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          # A re-run uploads under the same name, and the action fails when
          # the first attempt's artifact exists.
          overwrite: true

  omp:
    if: ${{ inputs.clients == '' || contains(format(' {0} ', inputs.clients), ' omp ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # omp runs on Bun. The package declares bun >=1.3.14 in its engines.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # The omp package is signed and carries a provenance attestation on npm.
      # No release asset with a checksum is published for it, so the pin is the
      # registry digest of the exact version. The digest must match before Bun
      # installs, and Bun checks the tarball against the registry's digest. The
      # version is the tag that the router agents were copied from.
      - name: Install omp
        env:
          VERSION: 18.2.8
          INTEGRITY: sha512-I8JXVNLJb8PfGS6mRGSKNq73+EX+R/GoaRBoMj8HTtOiwF112QXH72UP2klTwoCiR2gTsACbAIWjD0JdrR3A3g==
        working-directory: ${{ runner.temp }}
        run: |
          actual=$(npm view "@oh-my-pi/pi-coding-agent@$VERSION" dist.integrity)
          [ "$actual" = "$INTEGRITY" ] || { echo "::error::registry digest of omp $VERSION changed"; exit 1; }
          bun install -g "@oh-my-pi/pi-coding-agent@$VERSION"
          omp --version | grep -F "$VERSION"

      - name: Install the plugin from the checkout
        run: |
          omp plugin marketplace add "$PWD"
          omp plugin install model-router@model-router

      # The case file names OPENROUTER_API_KEY as the variable that the
      # model provider of the omp case reads. Change both together.
      - name: Run the cases
        env:
          OPENROUTER_API_KEY: ${{ secrets.OMP_PROVIDER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/evals.ts run --client omp --out "$RUNNER_TEMP/results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evals-omp
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          overwrite: true
