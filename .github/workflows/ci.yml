name: ci

# Validates the plugins and runs their tests on Ubuntu and macOS, on every pull
# request and every push to main. `claude plugin test` runs with no session and
# no sign-in, so the job needs no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # Actions are pinned to a commit sha rather than a tag, because a tag
      # can be moved to point at different code; the trailing comment records
      # which release each sha is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The job only reads the repository, so the token need not stay in the checkout.
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.294

      - name: Install the dev tools
        run: npm ci

      # npm's default audit level: any open advisory against an installed
      # package fails the job. Dependabot opens the pull request with the fix.
      - name: Audit the dev tools
        run: npm audit

      # Every installed package must carry a valid registry signature, and
      # a provenance attestation where the package publishes one.
      - name: Verify the registry signatures
        run: npm audit signatures

      # The hooks are checked against the declarations Claude Code writes
      # beside a loaded mod, and no command writes them without a session,
      # so CI type-checks the scripts only. README's Development section has
      # the local command.
      - name: Type-check the scripts
        run: npx tsc -p scripts

      - name: Lint and check the formatting
        run: npx biome ci --error-on-warnings .

      # --strict fails on warnings too, as the publishing docs say to run it in CI.
      - name: Validate the plugin
        run: claude plugin validate --strict plugins/model-router

      # Every hook and engine call is a line in the directory's review and in
      # the README. A change here is a decision, not a side effect.
      - name: Check the mod's surface
        run: node scripts/check-surface.ts

      - name: Run the tests
        run: claude plugin test plugins/model-router

      # shared/ is copied byte for byte into the plugin folders, and every
      # manifest carries the same version.
      - name: Check the shared copies and versions
        run: node scripts/sync.ts --check

      - name: Run the shared, script and omp tests
        run: node --test 'shared/*.test.ts' 'scripts/*.test.ts' 'plugins/model-router-omp/tests/*.test.ts'

      # Replays the recorded client output, so it needs no model and no key.
      - name: Run the evals selftest
        run: node scripts/evals.ts selftest
