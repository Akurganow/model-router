name: ci

# Validates the plugins and runs their tests on Ubuntu and macOS, on every pull
# request and every push to main. `claude plugin test` runs with no session and
# no sign-in, so the job needs no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # Actions are pinned to a commit sha rather than a tag, because a tag
      # can be moved to point at different code; the trailing comment records
      # which release each sha is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The job only reads the repository, so the token need not stay in the checkout.
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-claude-code

      - name: Install the dev tools
        run: npm ci

      # npm's default audit level: any open advisory against an installed
      # package fails the job. Renovate opens the pull request with the fix.
      - name: Audit the dev tools
        run: npm audit

      # Every installed package must carry a valid registry signature, and
      # a provenance attestation where the package publishes one.
      - name: Verify the registry signatures
        run: npm audit signatures

      # Each plugin runs a bundle, so validation and tests check a fresh build of
      # src/. The step builds the manifests, the catalogues and both bundles.
      - name: Build the generated files
        run: node scripts/build.ts

      # The generated files are committed, because the plugin installs read them
      # from the repository. A difference means the commit holds a stale copy.
      - name: Check that the generated files match the commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated files differ from the commit. Run node scripts/build.ts and commit the result."
            exit 1
          fi

      # src/ declares the few mod types it uses, so it type-checks without the
      # declarations Claude Code writes beside a loaded mod. The plugin tests
      # need those declarations. CONTRIBUTING.md has the local command.
      - name: Type-check the sources and scripts
        run: npx tsc -p src && npx tsc -p scripts

      - name: Lint and check the formatting
        run: npx biome ci --error-on-warnings .

      # Every hook and engine call is a line in the directory's review and in
      # the README. A change here is a decision, not a side effect.
      - name: Check the mod's surface
        run: node scripts/check-surface.ts

      - name: Run the tests
        run: claude plugin test plugins/model-router

      # Every manifest, the omp catalog included, carries the same version.
      - name: Check the versions
        run: node scripts/set-version.ts --check

      # The test script in package.json holds the globs and the timeout, so
      # CI and npm run check run the same set.
      - name: Run the source, script and omp tests
        run: npm test

  # A user installs the committed files, so this job runs no build. It proves
  # that each client accepts the manifests and catalogues as they are checked in.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keeps Claude Code at the pinned version for the whole job.
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-claude-code

      # --strict fails on warnings too, as the publishing docs say to run it in
      # CI. The second command validates .claude-plugin/marketplace.json.
      - name: Validate the plugin and the catalogue
        run: |
          claude plugin validate --strict plugins/model-router
          claude plugin validate --strict .

      - name: Install the Claude Code plugin from the checkout
        run: |
          claude plugin marketplace add "$PWD"
          claude plugin install model-router@model-router
          claude plugin list | grep -F model-router

      - uses: ./.github/actions/setup-omp

      - name: Install the omp plugin from the checkout
        run: |
          omp plugin marketplace add "$PWD"
          omp plugin install model-router@model-router
          omp plugin list | grep -F model-router

  # The npm package is a committed tree, so this job packs that tree as it is.
  # It proves that the tarball holds the files the tree lists, that npm accepts
  # it for publishing, and that OpenClaw and omp install it. Both harnesses run
  # with their state and config under the runner's temp folder.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # The install check takes the plugin's names from src/, which loads the
      # TypeSafe SDK.
      - name: Install the dev tools
        run: npm ci

      - uses: ./.github/actions/setup-openclaw

      - uses: ./.github/actions/setup-omp

      # omp reads PI_CONFIG_DIR relative to the home folder.
      - name: Keep the harness state under the runner's temp folder
        run: |
          {
            echo "OPENCLAW_STATE_DIR=$RUNNER_TEMP/openclaw-state"
            echo "OPENCLAW_CONFIG_PATH=$RUNNER_TEMP/openclaw-state/openclaw.json"
            echo "OPENCLAW_HOME=$RUNNER_TEMP/openclaw-home"
            echo "PI_CONFIG_DIR=$(realpath -m --relative-to="$HOME" "$RUNNER_TEMP/omp-config")"
            echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/omp-config/agent"
          } >> "$GITHUB_ENV"

      # The script fails when npm packs other files than the tree's files
      # list and npm's always-packed files give, and prints the tarball path.
      - name: Pack the tree and check the file list
        id: pack
        run: |
          tarball=$(node scripts/check-npm-pack.ts "$RUNNER_TEMP/pack")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # A dry run goes through every publish check and sends nothing.
      - name: Dry-run the publish
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish --dry-run --access public --ignore-scripts "$TARBALL"

      # The script checks the inspect report's status, imported and enabled
      # fields, its contracts.tools and its diagnostics. The inspection does
      # not activate the plugin, so the script also registers the installed
      # bundle against a recording api.
      - name: Install the tarball into OpenClaw
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          openclaw plugins install "npm-pack:$TARBALL" --force --accept-capabilities
          openclaw plugins inspect model-router-openclaw --runtime --json > "$RUNNER_TEMP/inspect.json"
          node scripts/check-openclaw-install.ts "$RUNNER_TEMP/inspect.json"

      # omp installs a registry name, a git spec or a folder, not a tarball.
      - name: Install the unpacked tarball into omp
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/unpacked"
          omp plugin install "$RUNNER_TEMP/unpacked/package"
          version=$(node -p 'require("./packages/model-router/package.json").version')
          omp plugin list | grep -F "@akurganow/model-router@$version"

  # The Hermes plugin is Python on the standard library only. Its tests run on
  # the oldest and the newest Python that Hermes supports, then under the
  # interpreter of the pinned Hermes release, which also validates the plugin
  # and installs it from the checkout. Hermes keeps its home under the
  # runner's temp folder, and no key is set.
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # The runner context is not available in a job's env, so the first step
      # sets the home for every later step.
      - name: Keep the Hermes home under the runner's temp folder
        run: echo "HERMES_HOME=$RUNNER_TEMP/hermes-home" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-hermes

      - name: Run the plugin's tests on Python 3.11 and 3.14
        run: |
          for version in 3.11 3.14; do
            uv run --no-project --python "$version" python -m unittest discover -s plugins/model-router-hermes/tests
          done

      - name: Validate the plugin
        run: hermes plugins validate plugins/model-router-hermes

      # The install clones the checkout's own commit through a file:// route,
      # as a user's install clones the repository's subfolder.
      - name: Install the plugin from the checkout
        run: |
          hermes plugins install "file://$PWD#plugins/model-router-hermes" --enable < /dev/null
          hermes plugins list --plain --no-bundled | grep -F model-router-hermes
          hermes config set delegation.backend model-router
          hermes config get delegation.backend | grep -Fx model-router

      # Under Hermes's interpreter the test that compares the default route
      # with Hermes's bundled default backend runs too.
      - name: Run the plugin's tests under Hermes's interpreter
        run: '"$HERMES_PYTHON" -m unittest discover -s plugins/model-router-hermes/tests'

  # Public logs and published files must not carry facts about a contributor's
  # setup. The base is the commit the change started from, so the scan reads
  # only the lines the change adds.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # The base commit comes through env, because a script text built from
      # event data could run injected commands.
      - name: Scan for owner-setup facts
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/scan-owner-setup.ts --base "$BASE"
