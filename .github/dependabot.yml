# Dependabot keeps the dev tools, the omp that the evals run and the actions
# current. A version is proposed 14 days after it is published, the same
# window as .npmrc, and the updates of a week arrive as one pull request per
# ecosystem.
# Security updates ignore the window: a fix for an advisory comes at once.
version: 2
updates:
  # The dev tools, and the Claude Code version that CI and the evals install.
  - package-ecosystem: npm
    directories: [/, /.github/actions/setup-claude-code]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        patterns: ["*"]

  # The omp version and every package it pulls in, pinned by evals/omp/bun.lock.
  - package-ecosystem: bun
    directory: /evals/omp
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      omp:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
