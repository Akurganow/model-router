# Dependabot keeps the dev tools and the actions current. A version is
# proposed 14 days after it is published, the same window as .npmrc, and
# the updates of a week arrive as one pull request per ecosystem.
# Security updates ignore the window: a fix for an advisory comes at once.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
