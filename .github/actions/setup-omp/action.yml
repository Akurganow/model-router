name: Set up omp
description: >
  Installs Bun and one of the two omp versions this folder pins, and puts
  `omp` on the PATH. `minimum/` pins the oldest omp the README supports, and
  `latest/` pins the latest omp release. Each package.json pins omp and its
  bun.lock locks it by digest. Renovate proposes new versions
  (CONTRIBUTING.md, Dependencies).
inputs:
  pin:
    description: Which omp pin to install, minimum or latest
    required: true
runs:
  using: composite
  steps:
    # omp runs on Bun. omp 18.14.0 and later declare bun >=1.4.4 in their
    # engines and refuse to start on an older Bun. omp 18.12.6 runs on it too.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.4"

    # The omp package is signed and carries a provenance attestation on npm.
    # No release asset with a checksum is published for it, so each bun.lock
    # pins omp and every package it pulls in by digest. Bun refuses a lockfile
    # that no longer matches the manifest, and a tarball whose digest differs.
    # No package runs code at install time. The install runs in a copy under
    # the runner's temp folder, so no node_modules lands in the checkout that
    # the plugin installs read.
    - name: Install omp
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PIN: ${{ inputs.pin }}
      run: |
        case "$PIN" in
          minimum|latest) ;;
          *)
            echo "::error::setup-omp: pin is '$PIN', but it must be minimum or latest."
            exit 1
            ;;
        esac
        dir="$RUNNER_TEMP/omp-$PIN"
        mkdir -p "$dir"
        cp "$ACTION_PATH/$PIN/package.json" "$ACTION_PATH/$PIN/bun.lock" "$dir/"
        cd "$dir"
        bun install --frozen-lockfile --ignore-scripts
        echo "$dir/node_modules/.bin" >> "$GITHUB_PATH"
        version=$(node -p 'require("./package.json").dependencies["@oh-my-pi/pi-coding-agent"]')
        node_modules/.bin/omp --version | grep -F "$version"
