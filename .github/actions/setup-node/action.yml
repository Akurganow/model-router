name: Set up Node
description: >
  Installs the Node version every workflow runs: the scripts, the build and
  the tests are TypeScript files that Node runs directly.
runs:
  using: composite
  steps:
    # Pinned to a commit sha; the comment records the release.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
