# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Keep the organization's settings and add only what this repository needs.
inheritance: true
reviews:
  # scripts/build.ts writes these bundles from src/ and esbuild drops comments, so the review reads the sources.
  path_filters:
    - "!plugins/model-router/hooks/register.js"
    - "!plugins/model-router-omp/extension/index.js"
    - "!plugins/model-router-openclaw/index.js"
    # The npm tree is generated from the plugin folders, so the review reads their sources.
    - "!packages/model-router/**"
