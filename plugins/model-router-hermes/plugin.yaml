{
  "name": "model-router-hermes",
  "version": "0.25.2",
  "description": "Routes Hermes Agent delegated tasks to your small, middle or large model and an effort that fits the task, judged by Jev or the decision model the provider setting names. It scores a task even when you set no model, and sets the effort unless you set one. For each routed task it sends the task text, condensed to at most 12,000 characters, and the task's context, shortened to fit, both with token-shaped strings such as keys masked, to the provider's own API (api.typesafe.ai, api.openai.com or generativelanguage.googleapis.com), to openrouter.ai or to both, as its provider and gateway settings allow, each with its own key. It sends a fixed text in place of an agent description, and the task's description parameter, masked the same way and cut to 500 characters, when the delegating model sets one. The plugin sets a model only from your small_model, middle_model and large_model settings. A key set as an environment variable is visible to every process Hermes starts.",
  "author": "Akurganow",
  "kind": "backend",
  "requires_hermes": ">=0.22.6",
  "provides_tools": [
    "model_router_config"
  ],
  "config_schema": {
    "provider": {
      "type": "str",
      "choices": [
        "typesafe",
        "openai",
        "google"
      ],
      "default": "typesafe",
      "label": "Scoring provider",
      "description": "Whose model scores each task. typesafe: Jev from TypeSafe, the model the plugin's questions are fitted to. openai: OpenAI's decision model; costs more than Jev and its answers are not fitted. google: Google's decision model; costs more than Jev and its answers are not fitted; on a free-tier key Google may use the text."
    },
    "gateway": {
      "type": "str",
      "choices": [
        "direct",
        "auto",
        "openrouter-first",
        "openrouter"
      ],
      "default": "direct",
      "label": "OpenRouter gateway",
      "description": "How OpenRouter is used to reach the provider. direct: the provider's own API only. auto: the provider's own API, then OpenRouter if it fails. openrouter-first: OpenRouter, then the provider's own API if it fails. openrouter: OpenRouter only. With auto or openrouter-first and both keys set, one task may reach both companies."
    },
    "small_model": {
      "type": "dict",
      "label": "Small model",
      "description": "The model a delegated task gets when the scoring model rates its task small, given as a dict that names a provider and a model. Unset: such a task keeps the model Hermes would give it, and the plugin still sets its effort unless you set one."
    },
    "middle_model": {
      "type": "dict",
      "label": "Middle model",
      "description": "The model a delegated task gets when the scoring model rates its task middle, given as a dict that names a provider and a model. Unset: such a task keeps the model Hermes would give it, and the plugin still sets its effort unless you set one."
    },
    "large_model": {
      "type": "dict",
      "label": "Large model",
      "description": "The model a delegated task gets when the scoring model rates its task large, given as a dict that names a provider and a model. Unset: such a task keeps the model Hermes would give it, and the plugin still sets its effort unless you set one."
    },
    "api_key": {
      "type": "secret",
      "env": "TYPESAFE_API_KEY",
      "label": "TypeSafe API key",
      "description": "Your TypeSafe API key. The plugin sends it to TypeSafe only, as the bearer token of the scoring request, and only when the provider setting is typesafe and the gateway setting allows TypeSafe's own API."
    },
    "openai_api_key": {
      "type": "secret",
      "env": "OPENAI_API_KEY",
      "label": "OpenAI API key",
      "description": "Your OpenAI API key. The plugin sends it to OpenAI only, as the bearer token of the scoring request, and only when the provider setting is openai and the gateway setting allows OpenAI's own API. Hermes's own OpenAI provider reads the same key and may use it for your own session. Set model.provider to keep another provider. The README, section Keys, says more."
    },
    "google_api_key": {
      "type": "secret",
      "env": "GEMINI_API_KEY",
      "label": "Google API key",
      "description": "Your Google API key. The plugin sends it to Google only, in the x-goog-api-key header of the scoring request, and only when the provider setting is google and the gateway setting allows Google's own API. Hermes's own Gemini provider reads the same key, after GOOGLE_API_KEY, and may use it for your own session. Set model.provider to keep another provider. The README, section Keys, says more."
    },
    "openrouter_api_key": {
      "type": "secret",
      "env": "OPENROUTER_API_KEY",
      "label": "OpenRouter API key",
      "description": "Your OpenRouter API key. The plugin sends it to OpenRouter only, as the bearer token of the scoring request, and only when the gateway setting allows OpenRouter. Hermes's own OpenRouter provider reads the same key and may use it for your own session. Set model.provider to keep another provider. The README, section Keys, says more."
    }
  }
}
